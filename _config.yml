url: https://ingascouter.github.io
timezone: Europe/Helsinki
lang: sv
title: Ingå Scouter
description: Ingå Scouter, ibland förkortat ISc, är den enda svenskspråkiga scoutkåren i Ingå som erbjuder aktiviteter för alla åldrar, inklusive veckomöten, hajker och läger. Vår vision är att främja hållbarhet, ledarskap och gemenskap för en bättre framtid för unga.

social:
  name: Ingå Scouter r.f.
  links:
    - https://www.facebook.com/ingascouter
    - https://www.instagram.com/ingascouter

defaults:
  -
    scope:
      path: "" # all files in the project
      type: "pages"
    values:
      layout: "default"
      banner: "/assets/banners/banner.png"
      date: 01-01-1970
      toc: true

plugins:
  # - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-toc

feed:
  posts_limit: 20
  categories:
    - news